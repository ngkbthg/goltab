<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #282828; overflow: hidden; user-select: none; font-family: monospace; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #ui {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px; opacity: 0.15; transition: opacity 0.25s ease;
      background: #32302f; padding: 8px 16px; border-radius: 6px;
      border: 1px solid #504945; font-size: 12px; color: #d4be98; white-space: nowrap;
    }
    #ui:hover { opacity: 0.9; }
    .key { color: #a9b665; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <span><span class="key">Drag</span> Draw</span>
    <span><span class="key">Space</span> Pause</span>
    <span><span class="key">S</span> Step</span>
    <span><span class="key">R</span> Random</span>
    <span><span class="key">C</span> Clear</span>
  </div>
  <script src="goltab.js"></script>
</body>
</html>
